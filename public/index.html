<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Khóa Học</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Hệ Thống Quản Lý Khóa Học Online</h1>
            <p class="subtitle">Quản lý khóa học, sinh viên và đăng ký học</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="courses">Khóa Học</button>
            <button class="tab" data-tab="students">Sinh Viên</button>
            <button class="tab" data-tab="enrollments">Đăng Ký</button>
        </nav>

        <!-- Courses Tab -->
        <div id="courses-tab" class="tab-content active">
            <div class="section-header">
                <h2>Quản Lý Khóa Học</h2>
                <button class="btn btn-primary" onclick="showCourseForm()">+ Thêm Khóa Học</button>
            </div>

            <div id="course-form" class="form-container" style="display: none;">
                <h3>Thêm Khóa Học Mới</h3>
                <form id="add-course-form">
                    <div class="form-group">
                        <label>Tên khóa học:</label>
                        <input type="text" id="course-name" required>
                    </div>
                    <div class="form-group">
                        <label>Mô tả:</label>
                        <textarea id="course-description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Giảng viên:</label>
                        <input type="text" id="course-instructor" required>
                    </div>
                    <div class="form-group">
                        <label>Thời lượng (giờ):</label>
                        <input type="number" id="course-duration" required>
                    </div>
                    <div class="form-group">
                        <label>Số sinh viên tối đa:</label>
                        <input type="number" id="course-max-students" value="30" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <button type="button" class="btn btn-secondary" onclick="hideCourseForm()">Hủy</button>
                    </div>
                </form>
            </div>

            <div id="courses-list" class="items-list"></div>
        </div>

        <!-- Students Tab -->
        <div id="students-tab" class="tab-content">
            <div class="section-header">
                <h2>Quản Lý Sinh Viên</h2>
                <button class="btn btn-primary" onclick="showStudentForm()">+ Thêm Sinh Viên</button>
            </div>

            <div id="student-form" class="form-container" style="display: none;">
                <h3>Thêm Sinh Viên Mới</h3>
                <form id="add-student-form">
                    <div class="form-group">
                        <label>Họ tên:</label>
                        <input type="text" id="student-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="student-email" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại:</label>
                        <input type="tel" id="student-phone">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <button type="button" class="btn btn-secondary" onclick="hideStudentForm()">Hủy</button>
                    </div>
                </form>
            </div>

            <div id="students-list" class="items-list"></div>
        </div>

        <!-- Enrollments Tab -->
        <div id="enrollments-tab" class="tab-content">
            <div class="section-header">
                <h2>Quản Lý Đăng Ký</h2>
                <button class="btn btn-primary" onclick="showEnrollmentForm()">+ Đăng Ký Khóa Học</button>
            </div>

            <div id="enrollment-form" class="form-container" style="display: none;">
                <h3>Đăng Ký Khóa Học</h3>
                <form id="add-enrollment-form">
                    <div class="form-group">
                        <label>Sinh viên:</label>
                        <select id="enrollment-student" required>
                            <option value="">-- Chọn sinh viên --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Khóa học:</label>
                        <select id="enrollment-course" required>
                            <option value="">-- Chọn khóa học --</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Đăng Ký</button>
                        <button type="button" class="btn btn-secondary" onclick="hideEnrollmentForm()">Hủy</button>
                    </div>
                </form>
            </div>

            <div id="enrollments-list" class="items-list"></div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="/js/app.js"></script>
</body>
</html>
